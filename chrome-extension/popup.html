<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bóveda Leads</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 300px;
      margin: 0;
      padding: 16px;
      background-color: #f9fafb;
      color: #111827;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      background: #FACC15;
      color: #000;
      font-weight: 900;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    h1 {
      font-size: 14px;
      font-weight: 800;
      margin: 0;
    }
    p {
      font-size: 11px;
      color: #6b7280;
      margin: 0 0 14px 0;
      line-height: 1.4;
    }
    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #4b5563;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus {
      border-color: #f59e0b;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #FACC15;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover {
      background-color: #eab308;
    }
    .status {
      font-size: 11px;
      text-align: center;
      color: #059669;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <h1>Bóveda Supabase Sync</h1>
    </div>
  </div>
  <p>Captura contactos de WhatsApp Web y envíalos en 1 clic a tu base de datos en Supabase.</p>

  <label for="apiUrl">URL de tu API de Leads:</label>
  <input type="text" id="apiUrl" placeholder="http://localhost:3000/api/leads">

  <button id="saveBtn">Guardar Configuración</button>
  <div id="status" class="status">✓ Ajustes guardados</div>

  <script src="popup.js"></script>
</body>
</html>
